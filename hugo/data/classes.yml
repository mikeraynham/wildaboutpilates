# The class schedule for Gawsworth Village Hall.
#
# The timetable on the classes page and the openingHoursSpecification
# structured data in _includes/address_gawsworth.html are both generated from
# this file, so those two cannot fall out of step.  They had: the page listed
# eight classes while the structured data listed six.
#
# This does not make the page as a whole self-consistent.  The `description` in
# classes.md front matter names the days in prose, is still written by hand, and
# had itself gone stale.  Check it when a day is added or dropped.
#
# Days appear in the order first seen here, and times within a day in the order
# given, so keep each day's entries together and in ascending time order.
#
#   day    Day name, as it should read on the page.  All entries for a day sit
#          under one heading, wherever they appear in this file.
#   start  Start time, 24-hour, "HH:MM".
#   end    End time, 24-hour, "HH:MM".
#   level  Ability level, shown beside the time.
#   since  Optional.  The date the class started, published as validFrom in the
#          structured data.  Omit when it is not known; the entry is still
#          published, just without validFrom.
#
# Times must stay quoted: unquoted 09:45 is read as a base-60 number, not text.

- day: Monday
  start: "09:45"
  end: "10:45"
  level: Beginners / improvers / intermediate
  since: "2022-01-03"

