# Sveltia CMS - proof of concept.
#
# This exists to answer one question: can Sveltia express StreamField-style
# typed blocks?  It is not a finished CMS setup and is not wired to GitHub.
#
# To run it:
#   bin/run                                     (serves Jekyll on :4000)
#   open http://localhost:4000/admin/index.html (in Chrome, Edge or Brave)
#   click "Work with Local Repository" and pick the repo root
#
# No authentication and no proxy server are needed for local work, so the
# `repo` below is deliberately arbitrary.  Firefox and Safari will not work:
# Sveltia's local mode needs the File System Access API.
#
# Delete the hugo/static/admin directory to remove all of this.

backend:
  name: github
  repo: mikeraynham/wildaboutpilates

media_folder: hugo/static/images
public_folder: /images

# This block is what makes Sveltia safe to point at a Jekyll site.
#
# quote: double
#   Sveltia is JavaScript and emits YAML 1.2, where `10:00` is a string.  Jekyll
#   is Ruby, and Psych implements YAML 1.1, where `10:00` is sexagesimal: it
#   reads back as the integer 36000.  Quoting every string closes the gap, and a
#   quoted scalar means the same thing under both standards.  Verified against
#   Ruby 3.4.10 / Psych 5.2.2: "09:45" reads as String, 09:45 reads as 35100.
#
# omit_empty_optional_fields
#   Without this, an untouched optional field is written as `more: ''`.  Empty
#   strings are truthy in Liquid, so `{% if include.more %}` would render an
#   empty link.  Omitting the key entirely makes the Liquid guard work.
output:
  omit_empty_optional_fields: true
  yaml:
    quote: double

collections:
  # ---------------------------------------------------------------------
  # TEST 1 - the real class-times data.
  #
  # Edits hugo/data/classes.yml in place, the same file the timetable and
  # the JSON-LD are generated from.  `root: true` is what lets a top-level
  # YAML array be edited at all; without it the list would nest under a key.
  #
  # Watch for: does `day` become a dropdown (so "monday" is unreachable), do
  # the time patterns reject "9:45", and what YAML does it write back?  The
  # last one matters: unquoted times are read as base-60 numbers.
  # ---------------------------------------------------------------------
  - name: data
    label: Site data
    files:
      - name: classes
        label: Class times
        file: hugo/data/classes.yml
        icon: schedule
        fields:
          - label: Classes
            name: classes
            widget: list
            root: true
            allow_reorder: true
            summary: '{{fields.day}} {{fields.start}}-{{fields.end}} - {{fields.level}}'
            fields:
              - label: Day
                name: day
                widget: select
                options:
                  - Monday
                  - Tuesday
                  - Wednesday
                  - Thursday
                  - Friday
              - label: Start
                name: start
                widget: string
                pattern: ['^([01]\d|2[0-3]):[0-5]\d$', 'Use 24-hour HH:MM, e.g. 09:45']
              - label: End
                name: end
                widget: string
                pattern: ['^([01]\d|2[0-3]):[0-5]\d$', 'Use 24-hour HH:MM, e.g. 10:45']
              - label: Level
                name: level
                widget: select
                options:
                  - Beginners / improvers / intermediate
                  - Intermediate / advanced
              - label: Started (optional)
                name: since
                widget: string
                required: false
                pattern: ['^\d{4}-\d{2}-\d{2}$', 'Use YYYY-MM-DD']
                hint: The date this class started. Published as validFrom in the structured data. Leave blank if unknown.

  # ---------------------------------------------------------------------
  # TEST 2 - THE ACTUAL QUESTION.
  #
  # A variable-type list: `types` gives each item its own shape, chosen by the
  # editor from a picker.  This is the StreamField equivalent, and whether it
  # works is the thing this whole proof of concept exists to find out.
  #
  # The four types below mirror the includes the real site already uses:
  # testimonial.html, image.html, class_times.html and address/map_gawsworth.
  #
  # Watch for: is there a real type picker when adding a block?  Can blocks be
  # reordered and mixed freely?  Do the collapsed summaries read well?  Can a
  # list nest inside a block (class times inside a Class times block)?
  # ---------------------------------------------------------------------
  - name: poc
    label: Block composition test
    label_singular: Test page
    folder: hugo/content/poc
    create: true
    extension: md
    format: yaml-frontmatter
    icon: science
    fields:
      - label: Title
        name: title
        widget: string

      - label: Page blocks
        name: blocks
        widget: list
        typeKey: type
        allow_reorder: true
        minimize_collapsed: true
        summary: '{{fields.type}}'
        types:
          - label: Testimonial
            name: testimonial
            summary: '{{fields.author}}'
            fields:
              - { label: Quote, name: content, widget: text }
              - { label: Author, name: author, widget: string }
              - { label: Link, name: more, widget: string, required: false }
              - { label: Link text, name: read_more, widget: string, required: false }

          - label: Image
            name: image
            summary: '{{fields.alt}}'
            fields:
              - { label: File, name: file, widget: image }
              - { label: Alt text, name: alt, widget: string }
              - { label: Caption, name: caption, widget: string, required: false }

          - label: Class times
            name: class_times
            summary: '{{fields.heading}}'
            fields:
              - { label: Heading, name: heading, widget: string, default: Class times }
              - label: Sessions
                name: sessions
                widget: list
                allow_reorder: true
                summary: '{{fields.day}} {{fields.start}}-{{fields.end}}'
                fields:
                  - label: Day
                    name: day
                    widget: select
                    options: [Monday, Tuesday, Wednesday, Thursday, Friday]
                  - { label: Start, name: start, widget: string, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', 'Use 24-hour HH:MM'] }
                  - { label: End, name: end, widget: string, pattern: ['^([01]\d|2[0-3]):[0-5]\d$', 'Use 24-hour HH:MM'] }
                  - label: Level
                    name: level
                    widget: select
                    options:
                      - Beginners / improvers / intermediate
                      - Intermediate / advanced

          - label: Venue
            name: venue
            summary: '{{fields.name}}'
            fields:
              - { label: Name, name: name, widget: string }
              - { label: Address, name: address, widget: text }
              - { label: Location, name: location, widget: map, required: false }

          - label: Text
            name: text
            fields:
              - { label: Body, name: body, widget: markdown }
